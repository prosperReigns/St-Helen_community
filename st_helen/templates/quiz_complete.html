{% extends "base.html" %}
{% load static %}

{% block title %} Quiz Complete {% endblock %}
{% block style %}
<link rel="stylesheet" href="{% static 'core/quiz_complete.css' %}">
{% endblock %}


{% block content %}
    <img src="/media/check.png" alt="Check mark">

    <h1>Congratulations!</h1>
    <p>You have completed your personality assessment.</p>

    <!-- CSRF token is included here in case there's a form for submitting feedback or data in the future -->
    <form method="POST">
        {% csrf_token %}
        <div class="btn-container">
            <button type="button" onclick="window.location.href='/'">Return to Home</button>
        </div>
    </form>
{% endblock %}
