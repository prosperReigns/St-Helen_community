{% extends "base.html" %}
{% load static %}

{% block title %} Quiz Complete {% endblock %}

{% block content %}
    <h1>Congratulations!</h1>
    <p>You have completed the quiz.</p>
    <p>Thank you for participating!</p>

    <!-- CSRF token is included here in case there's a form for submitting feedback or data in the future -->
    <form method="POST">
        {% csrf_token %}
        <div class="btn-container">
            <button type="button" onclick="window.location.href='/'">Go to home page</button>
        </div>
    </form>
{% endblock %}
