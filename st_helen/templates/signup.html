{% extends "base.html" %}
{% load static %}

{% block title %} Sign Up {% endblock %}

{% block content %}
    <h1 style="text-align: center; margin-top: 20px; color:darkcyan;">Sign Up</h1>
    <p style="text-align:center; color:black;">Create an account to get started</p>
    <form action="" method="POST"> 
        {% for message in messages %}
        <p style="color:red; text-align:center;font-weight: bold; font-family: ;">{{message}}</p>
        {% endfor %}

        {% csrf_token %} <!-- prevents it getting hacked -->
        <div class="form-control">
            <label for="uname">username</label>
            <input type="text" name="username" id="uname">
        </div>
        <div class="form-control">
            <label for="email">email</label>
            <input type="email" name="email" id="email">
        </div>
        <div class="form-control">
            <label for="password">password</label>
            <input type="password" name="password" id="password">
        </div>
        <div class="form-control">
            <label for="password2">confirm password</label>
            <input type="password" name="password2" id="password2">
        </div>

        <div class="form-control">
            <button type="submit">register</button>
        </div>
    </form>
{% endblock %}
